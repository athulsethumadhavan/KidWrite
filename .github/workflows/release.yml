# main → TestFlight and the Play internal track.
#
# This does NOT submit to review. Merging dev into main is how a build gets
# staged for testing; promoting it to the stores is the separate `promote`
# workflow, run by hand once the build has been tried on a device. A merge
# should never be able to put something in front of Apple by accident.

name: release

on:
  push:
    branches: [main]
    # The site and the write-ups ship with the app but are not part of it.
    # Editing a page should not spend a build, and on Android it cannot: the
    # versionCode has not moved, so Play would reject the upload anyway.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      skip_ios:
        description: "Skip the iOS upload"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  test:
    name: analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded

      - name: Read the version
        id: v
        run: |
          line=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=${line%%+*}" >> "$GITHUB_OUTPUT"
          echo "build=${line##*+}"   >> "$GITHUB_OUTPUT"

      - name: Version must agree across files
        run: |
          name=$(grep '^flutter.versionName=' android/local.properties | cut -d= -f2 || true)
          code=$(grep '^flutter.versionCode=' android/local.properties | cut -d= -f2 || true)
          # local.properties is gitignored on CI; only check when present.
          if [ -n "$name" ] && [ "$name" != "${{ steps.v.outputs.version }}" ]; then
            echo "::error::pubspec says ${{ steps.v.outputs.version }}, local.properties says $name"
            exit 1
          fi
          if [ -n "$code" ] && [ "$code" != "${{ steps.v.outputs.build }}" ]; then
            echo "::error::pubspec build ${{ steps.v.outputs.build }} != versionCode $code"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  android:
    name: Play internal track
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: android

      - name: Restore the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/kid_write-keystore.jks

      - name: Write local.properties
        # Signing credentials and the version live here. Never committed.
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          {
            echo "flutter.versionName=${{ needs.test.outputs.version }}"
            echo "flutter.versionCode=${{ needs.test.outputs.build }}"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
            echo "storePassword=$STORE_PASSWORD"
          } >> android/local.properties

      - name: Play Store service account
        env:
          PLAY_JSON: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: echo "$PLAY_JSON" > android/fastlane/play-store-key.json

      - name: Upload
        working-directory: android
        run: bundle exec fastlane internal

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

  # ---------------------------------------------------------------------------
  ios:
    name: TestFlight
    needs: test
    if: ${{ !inputs.skip_ios }}
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ios

      - name: Read access to the certificates repo
        # match clones a private repo over SSH. A deploy key scoped to that one
        # repo is the least it can be given.
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}

      - name: Upload
        working-directory: ios
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ITC_TEAM_ID: ${{ secrets.APPLE_ITC_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
        run: bundle exec fastlane beta
